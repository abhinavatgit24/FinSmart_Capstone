spring.application.name=finsmart

# The app uses calendar dates (not instants) for transactions and reporting.
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}

# One-time repair for dates saved before MongoConfig. Keep disabled normally.
app.legacy-date-migration.enabled=false
app.legacy-date-migration.apply=false

# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/finsmart}
spring.data.mongodb.database=finsmart

# JWT
jwt.secret=${JWT_SECRET:FinSmartSuperSecretKeyMustBeAtLeast256BitsLongForHS256Algorithm2026}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Server
server.port=8080

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# File Upload (CSV Import)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Gemini AI — value comes from environment variable GEMINI_API_KEY
# Run locally: $env:GEMINI_API_KEY="your_key"  (PowerShell)
# On Render: add GEMINI_API_KEY as an Environment Variable in the dashboard
gemini.api.key=${GEMINI_API_KEY}
